[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "unity-apk-re"
version = "0.3.0"
description = "Pull Unity Android games over adb, extract APK sets, and report on Unity data, IL2CPP metadata and native libraries."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
uare = "uare.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
